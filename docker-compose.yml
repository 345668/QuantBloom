# Local containerized deployment: `docker compose up --build`
# then open http://localhost:3001
#
# The trading bot needs a persistent process to hold position state between
# cycles, which this container provides — unlike the serverless deployment.

services:
  quantbloom:
    build: .
    ports:
      - "3001:3001"
    # API keys and bot credentials are read from your local .env (gitignored).
    # Copy .env.example to .env and fill in what you have; missing keys just
    # disable the panels that need them.
    env_file:
      - .env
    environment:
      API_PORT: "3001"
    # Persist trained/published models across container restarts.
    volumes:
      - quantbloom-models:/app/.models
    restart: unless-stopped

volumes:
  quantbloom-models:
